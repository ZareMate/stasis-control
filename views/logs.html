<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Activity Logs · Stasis Control</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    .logs-page{width:min(1180px,90vw);margin:auto;padding:52px 0 90px}
    .logs-heading{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:26px}
    .logs-heading h2{font-size:clamp(34px,6vw,54px);margin:8px 0 0}
    .back-link{color:var(--accent2);font-size:12px;text-decoration:none}
    .filters{display:flex;flex-wrap:wrap;gap:12px;margin:22px 0}
    .filters label{color:var(--muted);font-size:10px;font-weight:800;letter-spacing:.1em}
    .filters select{display:block;min-width:200px;margin-top:7px;padding:11px 12px;border:1px solid var(--line);background:var(--panel);color:#eee}
    .logs-table{width:100%;border-collapse:collapse;border:1px solid var(--line);background:var(--panel)}
    .logs-table th,.logs-table td{text-align:left;padding:13px 15px;border-bottom:1px solid var(--line);font-size:12px;vertical-align:top}
    .logs-table th{color:var(--muted);font-size:9px;letter-spacing:.12em}
    .logs-table td:first-child{white-space:nowrap;color:var(--muted)}
    .log-action{color:var(--accent);font-weight:900}
    .empty{padding:24px;color:var(--muted)}
    @media(max-width:700px){.logs-table th:nth-child(1),.logs-table td:nth-child(1){display:none}.logs-table th,.logs-table td{padding:11px 9px}}
  </style>
</head>
<body>
  <header class="topbar">
    <div><div class="eyebrow">CREATECRAFT NETWORK</div><h1>Stasis Control</h1></div>
    <div class="topbar-actions"><span id="user" class="user-name"></span><a class="back-link" href="/">DASHBOARD</a></div>
  </header>
  <main class="logs-page">
    <div class="logs-heading"><div><span class="eyebrow">AUDIT TRAIL</span><h2>Activity logs</h2></div></div>
    <div class="filters">
      <label>TYPE<select id="typeFilter"><option value="">All types</option></select></label>
      <label>USER<select id="userFilter"><option value="">All users</option></select></label>
    </div>
    <div id="results"></div>
  </main>
  <script>
    const esc = value => String(value ?? "").replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;").replaceAll('"', "&quot;").replaceAll("'", "&#039;");
    const typeFilter = document.getElementById("typeFilter");
    const userFilter = document.getElementById("userFilter");
    let users = [];
    async function loadOptions() {
      const response = await fetch("/api/logs", { cache: "no-store" });
      if (response.status === 401) { location.assign("/"); return; }
      const data = await response.json();
      document.getElementById("user").textContent = data.currentUser || "";
      for (const type of data.types) typeFilter.insertAdjacentHTML("beforeend", '<option value="' + esc(type) + '">' + esc(type) + '</option>');
      users = data.users;
      for (const user of users) userFilter.insertAdjacentHTML("beforeend", '<option value="' + esc(user) + '">' + esc(user) + '</option>');
      render(data.logs);
    }
    async function filterLogs() {
      const query = new URLSearchParams();
      if (typeFilter.value) query.set("type", typeFilter.value);
      if (userFilter.value) query.set("user", userFilter.value);
      const response = await fetch("/api/logs?" + query.toString(), { cache: "no-store" });
      if (response.status === 401) { location.assign("/"); return; }
      const data = await response.json();
      render(data.logs);
    }
    function render(entries) {
      const results = document.getElementById("results");
      if (!entries.length) { results.innerHTML = '<div class="empty">No matching activity.</div>'; return; }
      results.innerHTML = '<table class="logs-table"><thead><tr><th>TIME</th><th>TYPE</th><th>USER</th><th>PEARL</th><th>LOCATION</th></tr></thead><tbody>' + entries.map(entry => '<tr><td>' + esc(new Date(entry.time).toLocaleString()) + '</td><td class="log-action">' + esc(entry.type || "—") + '</td><td>' + esc(entry.actor || "—") + '</td><td>' + esc(entry.player || "—") + '</td><td>' + esc((entry.detail || "") + (entry.chamber != null ? ' · Chamber ' + entry.chamber : "")) + '</td></tr>').join("") + '</tbody></table>';
    }
    typeFilter.addEventListener("change", filterLogs);
    userFilter.addEventListener("change", filterLogs);
    loadOptions().catch(() => { document.getElementById("results").innerHTML = '<div class="empty">Unable to load activity logs.</div>'; });
  </script>
</body>
</html>
