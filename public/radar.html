<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Stasis Radar</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/radar.css">
  <link rel="stylesheet" href="/radar-overrides.css">
</head>
<body class="radar-page">
  <header class="topbar radar-topbar">
    <div class="radar-brand">
      <span class="radar-brand-mark">SR</span>
      <div>
        <div class="radar-brand-name">STASIS RADAR</div>
        <div class="radar-brand-sub">CREATECRAFT NETWORK</div>
      </div>
    </div>
    <div class="topbar-actions">
      <div class="connection radar-connection"><span id="dot" class="dot offline"></span><span id="connectionText">Connecting</span></div>
      <a class="config-button" href="/">CONTROL</a>
    </div>
  </header>
  <main class="radar-main">
    <section class="radar-heading">
      <div>
        <div class="radar-page-title"><span>AREA RADAR</span><strong id="radarMeta">No signal</strong></div>
        <h2>Live tactical map</h2>
      </div>
      <div class="radar-header-note">REAL-TIME PLAYER TRACKING</div>
    </section>
    <section class="roads-panel map-editor-panel"><div class="editor-heading"><div><h3>Roads</h3><p>Shared map areas</p></div><span class="editor-count" id="roadCount">0</span></div><form id="roadForm" class="road-form"><input id="roadId" type="hidden"><input id="roadX1" type="number" step="1" required placeholder="X1" aria-label="First X coordinate"><input id="roadZ1" type="number" step="1" required placeholder="Z1" aria-label="First Z coordinate"><input id="roadX2" type="number" step="1" required placeholder="X2" aria-label="Second X coordinate"><input id="roadZ2" type="number" step="1" required placeholder="Z2" aria-label="Second Z coordinate"><button id="roadSubmit" type="submit">ADD ROAD</button></form><div id="roadStatus" class="road-status" aria-live="polite"></div><div id="roadList" class="road-list"></div></section>
    </section>
  </main>
  <script src="/radar.js"></script>
</body>
</html>
